{% for content in project.contents.all %}
  <h2>{{ content.title }}</h2>

  {% if content.content_type == 'text' %}
    <p>{{ content.content }}</p>
  {% elif content.content_type == 'image' %}
    <img src="{{ content.image.url }}" alt="{{ content.title }}" />
  {% elif content.content_type == 'code' %}
    <pre>
      <code>{{ content.content }}</code>
    </pre>
  {% endif %}
{% endfor %}
